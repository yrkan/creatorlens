# gitleaks configuration (design v2, SEC-11). The default rules (AIza… API keys among them) plus Google's OAuth secrets,
# which the default set misses: client secrets, access tokens, refresh tokens and client JSON files.
# Run with: sh scripts/gitleaks.sh git   (whole history)   or   sh scripts/gitleaks.sh staged   (the pre-commit hook)

title = "creatorlens"

[extend]
useDefault = true

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[A-Za-z0-9_-]{28}'''
keywords = ["gocspx-"]

[[rules]]
id = "google-oauth-access-token"
description = "Google OAuth access token"
regex = '''ya29\.[A-Za-z0-9_-]{20,}'''
keywords = ["ya29."]

[[rules]]
id = "google-oauth-refresh-token"
description = "Google OAuth refresh token"
regex = '''1//0[A-Za-z0-9_-]{30,}'''
keywords = ["1//0"]

[[rules]]
id = "google-oauth-client-json"
description = "A client_secret value, as in a downloaded OAuth client JSON"
regex = '''"client_secret"\s*:\s*"[^"\s]{10,}"'''
keywords = ["client_secret"]
